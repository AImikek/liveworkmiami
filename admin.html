<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiveWork Miami · Admin</title>
<!-- build: v5 · full-term commitment agreement + summary filters, delete, document links, signature certificate (Aug 27, 2026) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
:root{ --paper:#FBFAF7; --sand:#F0EADF; --ink:#17191E; --soft:#5A5C63; --hair:rgba(23,25,30,.14);
  --accent:#0D7368; --f-d:'Fraunces',serif; --f-b:'Manrope',sans-serif;
  --f-sig:'Great Vibes','Snell Roundhand','Segoe Script',cursive; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:var(--f-b); background:var(--paper); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
.wrap{ max-width:1100px; margin:0 auto; padding:0 24px; }
h1,h2,h3{ font-family:var(--f-d); font-weight:400; letter-spacing:-.01em; }
header{ border-bottom:1px solid var(--hair); padding:22px 0; position:sticky; top:0; background:rgba(251,250,247,.9); backdrop-filter:blur(14px); z-index:10; }
header .wrap{ display:flex; align-items:center; justify-content:space-between; }
.brand{ font-family:var(--f-d); font-size:1.2rem; } .brand i{ font-style:italic; }
.brand b{ font-family:var(--f-b); font-size:.62rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-left:8px; vertical-align:middle; }
.btn{ font-family:var(--f-b); font-weight:600; font-size:.85rem; cursor:pointer; border:1px solid var(--hair);
  background:#fff; color:var(--ink); border-radius:4px; padding:9px 16px; transition:.2s; }
.btn:hover{ border-color:var(--ink); }
.btn.solid{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.solid:hover{ background:var(--accent); border-color:var(--accent); }
.btn.sm{ padding:7px 12px; font-size:.8rem; }
.btn.ok{ color:var(--accent); border-color:var(--accent); }
.btn.no{ color:#C0392B; border-color:rgba(192,57,43,.4); }
.btn.no:hover{ border-color:#C0392B; background:rgba(192,57,43,.05); }

/* login */
.gate{ max-width:380px; margin:18vh auto; text-align:center; padding:0 24px; }
.gate h2{ font-size:1.8rem; font-weight:300; margin-bottom:8px; }
.gate p{ color:var(--soft); margin-bottom:24px; }
.gate input{ width:100%; font-family:var(--f-b); font-size:1rem; padding:13px 14px; border:1px solid var(--hair); border-radius:4px; margin-bottom:12px; }
.gate input:focus{ outline:none; border-color:var(--accent); }
.gate .btn{ width:100%; }
.gate .err{ color:#C0392B; font-size:.85rem; min-height:1.2em; margin-top:10px; }

/* dashboard */
main{ padding:34px 0 80px; display:none; }
.head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
.head h1{ font-size:2.2rem; font-weight:300; }
.summary{ display:flex; gap:14px; margin:18px 0 28px; flex-wrap:wrap; }
.summary .s{ cursor:pointer; padding:8px 14px; border-radius:8px; border:1px solid transparent; transition:.2s; }
.summary .s:hover{ background:var(--sand); }
.summary .s.active{ border-color:var(--accent); background:rgba(13,115,104,.06); }
.summary .s b{ font-family:var(--f-d); font-weight:300; font-size:1.7rem; display:block; }
.summary .s.active b{ color:var(--accent); }
.summary .s span{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
.toolbar{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.toolbar input{ flex:1; min-width:200px; font-family:var(--f-b); font-size:.92rem; padding:11px 13px; border:1px solid var(--hair); border-radius:4px; }
.toolbar input:focus{ outline:none; border-color:var(--accent); }
.toolbar select{ font-family:var(--f-b); font-size:.9rem; padding:11px 13px; border:1px solid var(--hair); border-radius:4px; background:#fff; }

.card{ border:1px solid var(--hair); border-radius:8px; padding:22px 24px; margin-bottom:14px; background:#fff; }
.card-top{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
.card-top .who h3{ font-size:1.3rem; }
.card-top .who .meta{ color:var(--soft); font-size:.88rem; margin-top:2px; }
.pill{ font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:5px 11px; border-radius:100px; white-space:nowrap; }
.pill.submitted{ background:rgba(13,115,104,.12); color:var(--accent); }
.pill.in_progress{ background:var(--sand); color:var(--soft); }
.pill.approved{ background:#0D7368; color:#fff; }
.pill.declined{ background:rgba(192,57,43,.12); color:#C0392B; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px 22px; margin:18px 0; }
.f label{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); display:block; margin-bottom:3px; }
.f div{ font-size:.92rem; }
.f a{ color:var(--accent); font-weight:600; text-decoration:none; }
.f a:hover{ text-decoration:underline; }
.tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.tag{ font-size:.72rem; background:var(--sand); border-radius:100px; padding:3px 10px; }
.chk{ font-size:.85rem; } .chk.y{ color:var(--accent); } .chk.n{ color:var(--soft); }
.sig-script{ font-family:var(--f-sig); font-size:1.45rem; line-height:1.2; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--hair); padding-top:16px; margin-top:4px; align-items:center; }
.actions .spacer{ flex:1; }
.empty{ text-align:center; color:var(--soft); padding:60px 0; }
.loading{ text-align:center; color:var(--soft); padding:50px 0; }
.note{ font-size:.8rem; color:var(--soft); margin-top:14px; }
.blk{ margin:0 0 14px; }
.blk label{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); display:block; margin-bottom:3px; }
.blk div{ font-size:.9rem; color:var(--soft); }
.doclinks div{ padding:2px 0; }
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div class="gate" id="gate">
  <div class="brand" style="font-size:1.4rem; margin-bottom:18px;">LiveWork <i>Miami</i><b>Admin</b></div>
  <h2>Admin access</h2>
  <p>Enter the admin password to view applications.</p>
  <input type="password" id="pw" placeholder="Admin password" />
  <button class="btn solid" onclick="login()">Enter</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- DASHBOARD -->
<header id="hdr" style="display:none;">
  <div class="wrap">
    <span class="brand">LiveWork <i>Miami</i><b>Admin</b></span>
    <div style="display:flex; gap:10px;">
      <button class="btn sm" onclick="load()">Refresh</button>
      <button class="btn sm" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <div class="head"><h1>Applications</h1></div>
    <div class="summary" id="summary"></div>
    <div class="toolbar">
      <input id="search" placeholder="Search name, email, phone, social…" oninput="render()" />
      <select id="filter" onchange="renderSummary();render()">
        <option value="all">All statuses</option>
        <option value="submitted">Submitted</option>
        <option value="approved">Approved</option>
        <option value="in_progress">In progress</option>
        <option value="declined">Declined</option>
      </select>
    </div>
    <div id="list"><div class="loading">Loading…</div></div>
    <p class="note">Click a document link to open it in a new tab (PDFs open right in the browser). Send invoices from Mercury; members pay by ACH or wire inside Mercury.</p>
  </div>
</main>

<script>
let PW = '';
let APPS = [];
const FILE_CACHE = {};   // fileId -> { name, type, size, dataUrl }
const fmt = n => '$' + Number(n||0).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt = iso => { if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
const fdate = s => { if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return s||''; const d = new Date(s+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const fmtSize = b => { b = Number(b||0); if(!b) return ''; if(b < 1024*1024) return Math.max(1,Math.round(b/1024)) + ' KB';
  return (b/1024/1024).toFixed(1) + ' MB'; };

async function api(body){
  const r = await fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ password:PW, ...body }) });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
  return r.json();
}

async function login(pwOverride){
  PW = pwOverride || document.getElementById('pw').value;
  try{
    await load();
    try{ localStorage.setItem('lwm_admin', PW); }catch(_){}
    document.getElementById('gate').style.display='none';
    document.getElementById('hdr').style.display='block';
    document.getElementById('main').style.display='block';
  }catch(e){
    document.getElementById('loginErr').textContent = e.message==='Unauthorized' ? 'Incorrect password.' : (e.message + ' · is the backend deployed with ADMIN_PASSWORD set?');
  }
}
function logout(){ PW=''; APPS=[]; try{ localStorage.removeItem('lwm_admin'); }catch(_){} location.reload(); }
/* auto-login with the remembered password */
addEventListener('DOMContentLoaded', ()=>{ try{ const saved=localStorage.getItem('lwm_admin'); if(saved) login(saved); }catch(_){} });

async function load(){
  const { apps } = await api({ action:'list' });
  APPS = apps || [];
  renderSummary(); render();
}
/* Summary numbers are clickable filters. */
function renderSummary(){
  const cnt = s => APPS.filter(a=>a.status===s).length;
  const f = document.getElementById('filter').value;
  const tile = (val,n,label)=>`<div class="s ${f===val?'active':''}" onclick="setFilter('${val}')" title="Show: ${label}"><b>${n}</b><span>${label}</span></div>`;
  document.getElementById('summary').innerHTML =
    tile('all', APPS.length, 'Total') +
    tile('submitted', cnt('submitted'), 'Awaiting review') +
    tile('approved', cnt('approved'), 'Approved') +
    tile('in_progress', cnt('in_progress'), 'In progress');
}
function setFilter(v){ document.getElementById('filter').value = v; renderSummary(); render(); }

function planSummary(p){
  if(!p) return '<span class="chk n">No plan</span>';
  const addons = (p.addons||[]).map(k=>({cleaning:'Cleaning',chef:'Chef',management:'Mgmt'}[k]||k));
  const tags = addons.map(a=>`<span class="tag">${a}</span>`).join('') || '<span class="tag">Base only</span>';
  return `<div>${esc(p.termLabel||'')} · <b>${fmt(p.monthlyTotal)}</b>/mo${p.discountPct?` · ${p.discountPct}% off`:''}</div>
    <div class="tags">${tags}</div>
    <div style="font-size:.8rem;color:var(--soft);margin-top:4px;">Due prior to move-in: ${fmt(p.dueAtMoveIn)}</div>`;
}

/* Social values become clickable links where possible; "NA" stays plain. */
function linkify(kind, v){
  if(!v) return '';
  const t = String(v).trim(); const low = t.toLowerCase();
  const lbl = { ig:'IG', li:'LI', web:'Web' }[kind];
  if(low==='na'||low==='n/a'||low==='none'||low==='-') return `${lbl}: <span class="chk n">${esc(t)}</span>`;
  let url = '';
  if(/^https?:\/\//i.test(t)) url = t;
  else if(kind==='ig') url = 'https://instagram.com/' + t.replace(/^@/,'').replace(/^instagram\.com\//i,'');
  else if(kind==='li' && low.includes('linkedin.com')) url = 'https://' + t.replace(/^\/+/,'');
  else if(kind==='web' && t.includes('.') && !t.includes(' ')) url = 'https://' + t;
  return url ? `${lbl}: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(t)}</a>` : `${lbl}: ${esc(t)}`;
}

/* Stored documents render as plain links; clicking opens the file in a new tab
   (PDFs open natively in the browser). */
function docCell(a){
  const docs = a.documents || {};
  const kinds = Object.keys(docs);
  if(!kinds.length){
    const legacy = [a.idFileName?'ID: '+a.idFileName:'', a.bgCheckFileName?'Report: '+a.bgCheckFileName:''].filter(Boolean);
    return legacy.length
      ? `<span class="chk n">Not stored</span><div style="font-size:.76rem;color:var(--soft);margin-top:2px;">${legacy.map(esc).join('<br>')}<br>(submitted before document storage was added)</div>`
      : '<span class="chk n">None</span>';
  }
  const idTypeLabel = a.idType==='drivers_license' ? "driver's license" : a.idType==='passport' ? 'passport' : '';
  return '<div class="doclinks">' + kinds.map(k=>{
    const v = docs[k]||{};
    const label = k==='id' ? ('Photo ID' + (idTypeLabel?' · '+idTypeLabel:'')) : k==='backgroundCheck' ? 'Screening report' : esc(k);
    const size = v.size ? ` <span style="color:var(--soft);font-size:.78rem;">(${fmtSize(v.size)})</span>` : '';
    if(v.fileId) return `<div><a href="#" onclick="return openDocFile('${esc(a.id)}','${esc(k)}',this)">${label} ↗</a>${size}</div>`;
    if(v.url)    return `<div><a href="${esc(v.url)}" target="_blank" rel="noopener">${label} ↗</a></div>`;
    return `<div><span class="chk n">${label}${v.name?' · '+esc(v.name):''} (not stored)</span></div>`;
  }).join('') + '</div>';
}
function dataUrlToBlob(u){
  const [h,b] = String(u).split(',');
  const mime = (h.match(/data:(.*?)(;|$)/)||[])[1] || 'application/octet-stream';
  const bin = atob(b||''); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function openDocFile(appId, kind, el){
  const a = APPS.find(x=>x.id===appId); const meta = a && (a.documents||{})[kind];
  if(!meta || !meta.fileId) return false;
  const w = window.open('', '_blank'); // open synchronously so popup blockers allow it
  try{
    if(w){ w.document.write('<title>Loading…</title><p style="font-family:sans-serif;color:#555;padding:20px;">Loading document…</p>'); }
    let f = FILE_CACHE[meta.fileId];
    if(!f){
      const prev = el ? el.textContent : '';
      if(el) el.textContent = 'Opening…';
      try{ f = await api({ action:'getFile', fileId: meta.fileId }); FILE_CACHE[meta.fileId] = f; }
      finally{ if(el) el.textContent = prev; }
    }
    const u = URL.createObjectURL(dataUrlToBlob(f.dataUrl));
    if(w) w.location = u; else window.open(u, '_blank');
  }catch(e){
    if(w) w.close();
    alert('Could not open document: ' + e.message);
  }
  return false;
}

/* Everything on the record that the named cells above don't already show.
   Any new form field added later appears here automatically. */
const SHOWN_KEYS = ['id','fullName','email','emailLower','phone','occupation','company','plan','status','lastStep',
  'moveIn','lengthOfStay','inMiami','schedule','wfh','guests','cleanliness',
  'instagram','linkedin','website','anythingElse','currentAddress','addr1','addr2','city','state','zip','mailingAddress',
  'signature','printedName','signedAt','agreeAll','agreeAccess','agreePay','agreeSign',
  'signedAtISO','signatureUA','signatureTz','signatureCertId','signatureIP','agreementSha256','agreementVersion',
  'ec1Name','ec1Phone','ec2Name','ec2Phone','idType','bgAuthorize','bgCheckFileName','idFileName',
  'paymentMethod','paymentAck','paymentSent','bankConnected','stripeCustomerId','paymentMethodId',
  'documents','moveInCharge','createdAt','updatedAt','decidedAt'];
function extraDetails(a){
  const rows = [];
  for(const [k,v] of Object.entries(a)){
    if(SHOWN_KEYS.includes(k)) continue;
    if(v==null || v==='' || v===false) continue;
    if(typeof v==='object') continue;
    const label = k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
    rows.push(`<b>${esc(label)}:</b> ${v===true?'✓':esc(String(v))}`);
  }
  return rows.length ? `<div class="blk"><label>Other details</label><div>${rows.join(' &nbsp;·&nbsp; ')}</div></div>` : '';
}

const STEP_NAMES = {0:'Contact',1:'Timing',2:'Lifestyle',3:'About',4:'Time questions',5:'Plan',6:'Background check',7:'Photo ID',8:'Agreement',9:'Payment',10:'Done'};

function render(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  const f = document.getElementById('filter').value;
  let rows = APPS.filter(a=>{
    if(f!=='all' && a.status!==f) return false;
    if(q){ const hay = [a.fullName,a.email,a.phone,a.company,a.occupation,a.instagram,a.linkedin,a.website]
      .filter(Boolean).join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const list = document.getElementById('list');
  if(!rows.length){ list.innerHTML = '<div class="empty">No applications match.</div>'; return; }
  list.innerHTML = rows.map(a=>{
    const payLabel = { ach:'ACH', wire:'Wire', applepay:'Apple Pay', venmo:'Venmo', paypal:'PayPal F&F' }[a.paymentMethod] || 'ACH or wire';
    const timing = [
      a.moveIn ? 'Move-in: ' + esc(fdate(a.moveIn)) : '',
      a.lengthOfStay ? 'Stay: ' + esc(a.lengthOfStay) : '',
      a.inMiami ? esc(a.inMiami) : ''
    ].filter(Boolean).join('<br>');
    const social = [ linkify('ig',a.instagram), linkify('li',a.linkedin), linkify('web',a.website) ].filter(Boolean).join('<br>');
    const lifestyle = [a.schedule, a.wfh?'WFH: '+a.wfh:'', a.guests?'Guests: '+a.guests:'', a.cleanliness?'Clean: '+a.cleanliness:'']
      .filter(Boolean).map(esc).join('<br>');
    const address = a.mailingAddress || a.currentAddress || '';
    const emergency = [
      a.ec1Name ? esc(a.ec1Name)+'<br>'+esc(a.ec1Phone||'') : '',
      a.ec2Name ? esc(a.ec2Name)+'<br>'+esc(a.ec2Phone||'') : ''
    ].filter(Boolean).join('<br>');
    const stopped = a.status==='in_progress' && (a.lastStep||a.lastStep===0)
      ? `<div style="font-size:.76rem;color:var(--soft);margin-top:2px;">Stopped at: ${esc(STEP_NAMES[a.lastStep]||String(a.lastStep))}</div>` : '';
    const signed = a.signature
      ? `<div class="sig-script">${esc(a.signature)}</div><div style="font-size:.8rem;color:var(--soft);">${a.signedAtISO?dt(a.signedAtISO):esc(fdate(a.signedAt))}</div>`
      : '<span class="chk n">Not signed</span>';
    const cell = (label, html) => html ? `<div class="f"><label>${label}</label><div>${html}</div></div>` : '';
    return `<div class="card">
      <div class="card-top">
        <div class="who"><h3>${esc(a.fullName||'(no name)')}</h3>
          <div class="meta">${[esc(a.occupation||''), a.company?esc(a.company):'', esc(a.email||''), esc(a.phone||'')].filter(Boolean).join(' · ')}</div></div>
        <span class="pill ${esc(a.status||'in_progress')}">${esc((a.status||'').replace('_',' '))}</span>
      </div>
      <div class="grid">
        ${cell('Plan', planSummary(a.plan))}
        ${cell('Timing', timing || '<span class="chk n">—</span>')}
        ${cell('Social', social || '<span class="chk n">—</span>')}
        ${lifestyle ? cell('Lifestyle', `<span style="font-size:.85rem;">${lifestyle}</span>`) : ''}
        ${cell('Signed', signed)}
        ${address ? cell('Mailing address', `<span style="font-size:.85rem;">${esc(address)}</span>`) : ''}
        ${cell('Checks', `
          <span class="chk ${a.bgAuthorize?'y':'n'}">${a.bgAuthorize?'✓':'·'} Background authorized</span><br>
          ${a.paymentAck?'<span class="chk y">✓ Mercury process acknowledged</span><br>':''}
          <span class="chk y">Invoice via ${payLabel}</span><br>
          <span class="chk ${a.moveInCharge?'y':'n'}">${a.moveInCharge?'✓ Charged '+fmt(a.moveInCharge.amount):'· Send Mercury invoice, confirm payment'}</span>`)}
        ${cell('Documents', docCell(a))}
        ${emergency ? cell('Emergency', emergency) : ''}
        ${cell('Received', a.createdAt ? dt(a.createdAt) : '')}
        ${cell('Updated', (a.updatedAt ? dt(a.updatedAt) : '') + stopped)}
      </div>
      ${a.anythingElse?`<div class="blk"><label>Notes from applicant</label><div style="font-size:.9rem;">${esc(a.anythingElse)}</div></div>`:''}
      ${extraDetails(a)}
      <div class="actions">
        ${a.signature?`<button class="btn sm" onclick="viewAgreement('${esc(a.id)}')">View signed agreement</button>`:''}
        <button class="btn sm ok" onclick="setStatus('${esc(a.id)}','approved')">Approve</button>
        <button class="btn sm no" onclick="setStatus('${esc(a.id)}','declined')">Decline</button>
        <span class="spacer"></span>
        <button class="btn sm no" onclick="deleteApp('${esc(a.id)}')" title="Permanently delete this application and its documents">Delete</button>
      </div>
    </div>`;
  }).join('');
}


/* Personalized commitment schedule, KEEP IDENTICAL to the copy in index.html
   so this reconstruction matches what the member signed. */
function AGREEMENT_SCHEDULE(p){
  if(!p || !p.monthlyTotal) return '';
  const m = Number(p.monthlyTotal)||0, dep = Number(p.deposit)||m, due = Number(p.dueAtMoveIn)||0;
  const isMtm = p.term === 'mtm';
  const months = p.term === '12' ? 12 : p.term === '6' ? 6 : 2;
  const feesTotal = m * months;
  const grand = feesTotal + dep;
  return `<div class="commit-box">
  <h4>Your membership commitment</h4>
  <p><b>Selected term:</b> ${esc(p.termLabel||'')}${isMtm?' (two-month minimum)':''} &nbsp;·&nbsp; <b>Monthly membership fee:</b> ${fmt(m)}<br>
  <b>${isMtm?'Minimum membership fees (two months)':'Membership fees for the full term'}:</b> ${fmt(feesTotal)} (${months} × ${fmt(m)})<br>
  <b>Membership deposit:</b> ${fmt(dep)}<br>
  <b>Total ${isMtm?'minimum ':''}membership commitment:</b> ${fmt(grand)}${isMtm?', continuing at '+fmt(m)+' per month after the minimum until ended with 30 days written notice':''}<br>
  <b>Due prior to move-in:</b> ${fmt(due)} (first month, last month, and deposit); remaining monthly fees are due monthly in advance.</p>
  </div>`;
}

async function setStatus(id, status){
  if(status==='declined' && !confirm('Decline this application?')) return;
  try{ await api({ action:'setStatus', id, status }); await load(); }
  catch(e){ alert('Error: '+e.message); }
}
async function deleteApp(id){
  const a = APPS.find(x=>x.id===id);
  const who = a && a.fullName ? a.fullName : 'this application';
  if(!confirm(`Delete ${who} permanently? Stored documents are deleted too. This cannot be undone.`)) return;
  try{ await api({ action:'delete', id }); await load(); }
  catch(e){ alert('Error: '+e.message); }
}
